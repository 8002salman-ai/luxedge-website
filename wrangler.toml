# Wrangler configuration — Luxedge Cloudflare deployment (reproducible from repo).
#
# Default target: PRODUCTION worker (luxedge-production) — serves the Vite SPA
# from dist/ via the ASSETS binding and runs the api/* handlers through
# worker/index.ts. `wrangler deploy` = production; `wrangler deploy --env
# staging` = luxedge-cloudflare-staging.
name = "luxedge-production"
main = "worker/index.ts"
account_id = "f542683e97458480452b0b8ef37a898a"
compatibility_date = "2026-08-20"
compatibility_flags = ["nodejs_compat"]
# Preserve non-secret variables configured in the Cloudflare dashboard during
# deploys (for example the AdSense OAuth client ID).
keep_vars = true

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Cloudflare Email Sending (outbound from sales@luxedge.us) — the send_email
# binding is available on Workers Paid plan (beta). Sending to verified
# destination addresses (8002salman@gmail.com) is free on all plans.
[[send_email]]
name = "SEND_MAIL"

# Plain-text env (non-secret). Secrets are set with `wrangler secret put`.
[vars]
VERCEL_ENV = "production"
DEPLOYMENT_ENV = "production"
# Cloudflare Email Routing management (self-service addresses). The API token
# itself is a SECRET (wrangler secret put CLOUDFLARE_API_TOKEN).
CLOUDFLARE_ACCOUNT_ID = "f542683e97458480452b0b8ef37a898a"
CLOUDFLARE_ZONE_ID = "33109dc6283b9e9cdafc2d1a0b05b6f8"

[env.staging]
name = "luxedge-cloudflare-staging"

[env.staging.vars]
VERCEL_ENV = "preview"
DEPLOYMENT_ENV = "staging"
