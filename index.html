<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luxedge — Premium Pet &amp; Animal Essentials</title>
    <meta name="description" content="Shop practical pet and horse essentials, read buying guides, and find clear shipping and return information at Luxedge." />
    <meta name="keywords" content="Luxedge, pet supplies, pet essentials, dog supplies, cat supplies, dog bed, cat toys, pet water fountain, grooming, smart pet feeder, pet accessories, online pet store" />

    <meta name="theme-color" content="#2563eb" />
    <meta name="google-adsense-account" content="ca-pub-5473713135927706" />
    <!-- This static ownership meta tag is Google's supported site-verification
         method.  The AdSense script itself is injected only after consent by
         MarketingManager, so a first visit never makes an ad request before
         the visitor has chosen. -->
    <link rel="canonical" href="https://luxedge.us" />
    <link rel="icon" type="image/png" href="/luxedge-mark.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Luxedge — Premium Pet &amp; Animal Essentials" />
    <meta property="og:description" content="Handpicked pet essentials for quality, comfort, and value. Clear delivery options and return policies." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://luxedge.us" />
    <meta property="og:site_name" content="Luxedge" />
    <meta property="og:image" content="https://luxedge.us/luxedge-lockup.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Luxedge — Premium Pet &amp; Animal Essentials" />
    <meta name="twitter:description" content="Handpicked pet essentials for quality, comfort, and value. Clear delivery options and return policies." />
    <meta name="twitter:image" content="https://luxedge.us/luxedge-lockup.svg" />

    <!-- Fonts: self-hosted via @fontsource-variable (bundled at build) — no
         external Google Fonts dependency, so typography loads reliably on
         every network. See src/index.css. -->

    {
      "@context": "https://schema.org",

        "addressRegion": "TX",

        "addressCountry": "US"
      },
      "sameAs": []
    }

  </head>
